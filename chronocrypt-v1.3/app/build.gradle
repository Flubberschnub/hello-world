plugins {
    id 'com.android.application'
}

android {
    namespace 'com.openai.chronocrypt.v13'
    compileSdk 35

    defaultConfig {
        applicationId 'com.openai.chronocrypt.v13'
        minSdk 21
        targetSdk 35
        versionCode 10300
        versionName '1.3.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
